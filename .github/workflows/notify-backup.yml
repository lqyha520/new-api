name: Backup and notify

on:
  schedule:
    - cron: "30 20 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notify-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install SSH keys
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: |
            ${{ secrets.DEPLOY_KEY }}
            ${{ secrets.SECONDARY_DEPLOY_KEY }}

      - name: Run backup on primary and relay to secondary
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          SECONDARY_HOST: 117.72.63.24
          SECONDARY_PORT: 22
        run: |
          set -euo pipefail
          primary_port="${DEPLOY_PORT:-22}"
          ssh-keyscan -T 10 -p "$primary_port" -H "$DEPLOY_HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null
          ssh-keyscan -T 10 -p "$SECONDARY_PORT" -H "$SECONDARY_HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null

          scp -P "$primary_port" -o ConnectTimeout=15 ops/new-api-backup-to-117.sh \
            "$DEPLOY_USER@$DEPLOY_HOST:/tmp/new-api-backup-to-117.sh"
          ssh -p "$primary_port" "$DEPLOY_USER@$DEPLOY_HOST" \
            'install -m 700 /tmp/new-api-backup-to-117.sh /usr/local/sbin/new-api-backup-to-117.sh; \
             BACKUP_LOCAL_ONLY=1 /usr/local/sbin/new-api-backup-to-117.sh'

          status=$(ssh -p "$primary_port" "$DEPLOY_USER@$DEPLOY_HOST" \
            'cat /opt/new-api-runtime/backups/last-backup.status')
          printf '%s\n' "$status" > "$RUNNER_TEMP/primary-status.txt"
          dump_name=$(printf '%s\n' "$status" | sed -n 's/^dump_name=//p')
          config_name=$(printf '%s\n' "$status" | sed -n 's/^config_name=//p')
          test -n "$dump_name"
          test -n "$config_name"

          scp -P "$primary_port" -o ConnectTimeout=15 \
            "$DEPLOY_USER@$DEPLOY_HOST:/opt/new-api-runtime/backups/$dump_name" \
            "$DEPLOY_USER@$DEPLOY_HOST:/opt/new-api-runtime/backups/$config_name" \
            "$RUNNER_TEMP/"

          scp -P "$SECONDARY_PORT" -o ConnectTimeout=15 \
            ops/new-api-secondary-restore.sh \
            "root@$SECONDARY_HOST:/tmp/new-api-secondary-restore.sh"
          scp -P "$SECONDARY_PORT" -o ConnectTimeout=15 \
            "$RUNNER_TEMP/$dump_name" "$RUNNER_TEMP/$config_name" \
            "root@$SECONDARY_HOST:/opt/new-api-backups/incoming/"
          ssh -p "$SECONDARY_PORT" "root@$SECONDARY_HOST" \
            'install -m 700 /tmp/new-api-secondary-restore.sh /usr/local/sbin/new-api-secondary-restore.sh; \
             RESTORE_FORCE=1 /usr/local/sbin/new-api-secondary-restore.sh'

          restore=$(ssh -p "$SECONDARY_PORT" "root@$SECONDARY_HOST" \
            'cat /opt/new-api-backups/state/last-restore.status 2>/dev/null || true')
          expected_restore="${dump_name%.dump}"
          printf '%s\n' "$restore" | grep -qx 'status=success'
          printf '%s\n' "$restore" | grep -qx "restored=$expected_restore"
          ssh -p "$primary_port" "$DEPLOY_USER@$DEPLOY_HOST" \
            "sed -i 's/^transfer=pending$/transfer=github_actions/' /opt/new-api-runtime/backups/last-backup.status"
          ssh -p "$primary_port" "$DEPLOY_USER@$DEPLOY_HOST" \
            'cat /opt/new-api-runtime/backups/last-backup.status' > "$RUNNER_TEMP/primary-status.txt"
          printf '%s\n' "$restore" > "$RUNNER_TEMP/restore-status.txt"
          cat "$RUNNER_TEMP/primary-status.txt"
          cat "$RUNNER_TEMP/restore-status.txt"

      - name: Send Feishu notification
        if: always()
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_RECEIVE_ID: ${{ secrets.FEISHU_RECEIVE_ID }}
        run: |
          set -euo pipefail
          primary=$(cat "$RUNNER_TEMP/primary-status.txt" 2>/dev/null || echo 'status=unreachable')
          restore=$(cat "$RUNNER_TEMP/restore-status.txt" 2>/dev/null || echo 'status=unreachable')
          auth_body=$(jq -nc --arg app_id "$FEISHU_APP_ID" --arg app_secret "$FEISHU_APP_SECRET" '{app_id:$app_id,app_secret:$app_secret}')
          token=$(curl --fail-with-body --silent --show-error -X POST -H 'Content-Type: application/json' \
            -d "$auth_body" https://open.feishu.cn/open-apis/auth/v3/tenant_access_token/internal | jq -r '.tenant_access_token')
          message=$(printf 'New API 每日备份\n\n%s\n---\n%s' "$primary" "$restore")
          content=$(jq -nc --arg text "$message" '{text:$text}')
          body=$(jq -nc --arg receive_id "$FEISHU_RECEIVE_ID" --arg content "$content" \
            '{receive_id:$receive_id,msg_type:"text",content:$content}')
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
            -d "$body" 'https://open.feishu.cn/open-apis/im/v1/messages?receive_id_type=open_id'
