name: Deploy to server

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/lqyha520/new-api
  DEPLOY_IMAGE: ghcr.nju.edu.cn/lqyha520/new-api

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build source image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:main
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install deployment key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEY }}

      - name: Deploy image to server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -eu
          port="${DEPLOY_PORT:-22}"
          ssh-keyscan -p "$port" -H "$DEPLOY_HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null
          for attempt in 1 2 3; do
            if scp -o ConnectTimeout=15 -o ServerAliveInterval=30 -P "$port" docker-compose.deploy.yml "$DEPLOY_USER@$DEPLOY_HOST:/opt/new-api/docker-compose.deploy.yml"; then
              break
            fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 5
          done
          ssh -p "$port" "$DEPLOY_USER@$DEPLOY_HOST" bash -s -- "$GITHUB_SHA" <<'REMOTE'
            set -eu
            sha="$1"
            env_file=/opt/new-api-runtime/.env
            sed -i '/^NEW_API_IMAGE=/d' "$env_file"
            printf 'NEW_API_IMAGE=${{ env.DEPLOY_IMAGE }}:%s\n' "$sha" >> "$env_file"
            cd /opt/new-api
            docker compose -p new-api -f docker-compose.deploy.yml --env-file "$env_file" pull new-api
            docker compose -p new-api -f docker-compose.deploy.yml --env-file "$env_file" up -d --no-build --remove-orphans
            docker image prune -f
            for i in $(seq 1 30); do
              status=$(docker inspect --format='{{.State.Health.Status}}' new-api-new-api-1 2>/dev/null || true)
              if [ "$status" = healthy ]; then exit 0; fi
              sleep 5
            done
            docker compose -p new-api -f docker-compose.deploy.yml ps
            exit 1
          REMOTE
